name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm e2e

      - name: E2E diagnostics
        if: failure()
        run: |
          find test-results -type f -name 'error-context.md' -print | while read -r f; do
            msg=$(sed -n '1,80p' "$f" | tr '\n' ' ' | cut -c1-1200)
            echo "::error title=E2E $(basename $(dirname "$f"))::$msg"
          done

      - name: Native SQLite module
        run: |
          pnpm --filter @room/database exec node -e \
            "const D=require('better-sqlite3');const db=new D(':memory:');db.pragma('journal_mode=WAL');console.log('better-sqlite3',db.prepare('select sqlite_version() v').get().v)"
